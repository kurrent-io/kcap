####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-dotnet
bootstrap: dotnet restore Capacitor.slnx
dotnet:
  solution: Capacitor.slnx
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses
exclude:
  # .editorconfig already settles these: no XML docs are published, unnamed enum values in a switch are a
  # suggestion, IDE0055 stays silent to keep the aligned layout, and var-or-type is a hint
  - name: CSharpWarnings__CS1591
  - name: CSharpWarnings__CS1573
  - name: CSharpWarnings__CS8524
  - name: BadChildStatementIndent
  - name: SuggestVarOrType_BuiltInTypes
  - name: SuggestVarOrType_Elsewhere
  - name: SuggestVarOrType_SimpleTypes
  - name: MoveLocalFunctionAfterJumpStatement
  - name: PreferConcreteValueOverDefault
  # Explicit `new T()` stays allowed where the type isn't evident, though .editorconfig prefers `new()`
  - name: ArrangeObjectCreationWhenTypeNotEvident
  # Tests may keep `new[] { … }` and collection initializers; production code still gets the suggestion
  - name: UseCollectionExpression
    paths:
      - test
  # Solution-wide usage and visibility analysis can't see serialization, DI, reflection or the clients
  # that bind to public contracts
  - name: AutoPropertyCanBeMadeGetOnly.Global
  - name: ClassWithVirtualMembersNeverInherited.Global
  - name: ConvertToConstant.Global
  - name: FieldCanBeMadeReadOnly.Global
  - name: IntroduceOptionalParameters.Global
  - name: MemberCanBeMadeStatic.Global
  - name: MemberCanBePrivate.Global
  - name: MemberCanBeProtected.Global
  - name: NotAccessedField.Global
  - name: NotAccessedPositionalProperty.Global
  - name: PropertyCanBeMadeInitOnly.Global
  - name: UnusedAutoPropertyAccessor.Global
  - name: UnusedMember.Global
  - name: UnusedMemberInSuper.Global
  - name: UnusedMethodReturnValue.Global
  - name: VirtualMemberNeverOverridden.Global
  # The build already fails on nullable warnings and unused usings; where ReSharper's own reading
  # disagrees (null-conditional chains, TUnit's generic assertions, ReactiveUI extensions) it is wrong
  - name: CSharpWarnings__CS8602
  - name: CSharpWarnings__CS8620
  - name: RedundantUsingDirective
  # Flags every dotnet_diagnostic severity and the keys Rider itself writes
  - name: EditorConfigKeyCorrectness
  # Avalonia XAML read as WPF: Window members unresolved, a DataContext binding resolved against the
  # element's own x:DataType, and a null in a binding path is Avalonia's unset value, not an error
  - name: XAMLErrors
  - name: Xaml.PossibleNullReferenceException
