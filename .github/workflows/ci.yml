name: CI

on:
  pull_request:
    # Skip markdown-only PRs, except under kcap/: every file in the shipped plugin is a SKILL.md, so
    # adding a skill is a markdown-only change, and the guard that catches an unlisted skill must
    # run on the PR that adds it. Order matters: later patterns re-include.
    paths:
      - '**'
      - '!**.md'
      - 'kcap/**'
  # The merge queue tests each PR on top of the main it will land on, so two PRs that pass alone cannot
  # break main together. Paths filters do not apply to this event; the whole suite runs.
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'

# A new commit supersedes an older run for the same PR. Pushes to main and tag builds key on their
# own ref and are never cancelled, so a release build always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a PR, the test projects its change can reach through the project graph; `all` otherwise.
  # The checkout is the PR's merge commit, so its first parent is the base it will merge onto.
  changes:
    name: Select test projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.select.outputs.projects }}
      plugin-docs: ${{ steps.select.outputs.plugin-docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Select
        id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          plugin_docs=false
          if [ "$EVENT" = pull_request ]; then
            # --no-renames lists both sides of a move, so the project a file left is selected too.
            changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
            selected="$(printf '%s\n' "$changed" | bash scripts/select-test-projects.sh)"
            # No grep -q: an early exit can SIGPIPE printf, which pipefail would read as a match.
            if [ -n "$changed" ] && [ -z "$(printf '%s\n' "$changed" | grep -vE '^kcap/.*\.md$' || true)" ]; then
              plugin_docs=true
            fi
          else
            selected=all
          fi
          projects="$(printf '%s' "$selected" | tr '\n' ' ' | sed 's/ *$//')"
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "plugin-docs=$plugin_docs" >> "$GITHUB_OUTPUT"
          {
            echo '### Test projects'
            if [ "$projects" = all ]; then echo 'All of them.'
            elif [ -z "$projects" ]; then echo 'None: nothing in this change reaches a test project.'
            else printf -- '- `%s`\n' $projects; fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: Build and test (${{ matrix.leg }})
    needs: changes
    if: needs.changes.outputs.plugin-docs != 'true'
    runs-on: ${{ matrix.os }}
    # About 1.4x the longest observed leg (Windows, 28m); this only has to catch a wedge, and GitHub's
    # kill takes the uploaded reports with it.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: ubuntu-latest, os: ubuntu-latest,  shard: all, modules: 3, tests: 4 }
          - { leg: getmac,        os: getmac,         shard: all, modules: 3, tests: 4 }
          # Narrower: at three-by-four this leg spent a 20s service-readiness budget and a 1s
          # memory-fetch budget inside the code under test with nothing actually slow.
          # Split in two because at two modules the Windows test step took the sum of every suite
          # over two lanes, and the Daemon suite alone fills one of them (754s of 2,057s).
          - { leg: windows-latest-daemon, os: windows-latest, shard: daemon, modules: 1, tests: 2 }
          - { leg: windows-latest-others, os: windows-latest, shard: others, modules: 2, tests: 2 }

    steps:
      - uses: actions/checkout@v7

      # A selection runs through a solution filter, so the module and width caps apply to it unchanged.
      # A shard keeps its part of the selection; an empty result skips the tests, and on the daemon
      # shard everything else too, since the others shard builds the whole solution.
      - name: Pick the test solution
        id: tests
        shell: bash
        env:
          PROJECTS: ${{ needs.changes.outputs.projects }}
          SHARD: ${{ matrix.shard }}
          DAEMON: test/Capacitor.Cli.Daemon.Tests.Unit/Capacitor.Cli.Daemon.Tests.Unit.csproj
        run: |
          set -euo pipefail
          if [ "$PROJECTS" = all ]; then
            if [ "$SHARD" = all ]; then echo "solution=Capacitor.slnx" >> "$GITHUB_OUTPUT"; exit 0; fi
            PROJECTS="$(sed -n 's|.*<Project Path="\([^"]*\)".*|\1|p' Capacitor.slnx | tr '\\' /)"
          fi
          selected=()
          for p in $PROJECTS; do
            case "$SHARD" in
              all) selected+=("$p") ;;
              daemon) if [ "$p" = "$DAEMON" ]; then selected+=("$p"); fi ;;
              others) if [ "$p" != "$DAEMON" ]; then selected+=("$p"); fi ;;
            esac
          done
          if [ "${#selected[@]}" -eq 0 ]; then echo "solution=" >> "$GITHUB_OUTPUT"; exit 0; fi
          solution=selected-tests.slnf
          list="$(printf '"%s",' "${selected[@]}")"
          printf '{"solution":{"path":"Capacitor.slnx","projects":[%s]}}\n' "${list%,}" > "$solution"
          cat "$solution"
          echo "solution=$solution" >> "$GITHUB_OUTPUT"

      # GetMac VMs leave TMPDIR empty, and dotnet's named mutexes then fail on first run. The suite's
      # socket paths need a short, symlink-free root, so not runner.temp.
      - name: Set TMPDIR
        if: runner.os == 'macOS'
        run: '[ -n "${TMPDIR:-}" ] || echo "TMPDIR=/private/tmp" >> "$GITHUB_ENV"'

      - name: Setup .NET
        if: matrix.shard != 'daemon' || steps.tests.outputs.solution != ''
        uses: ./.github/actions/setup-dotnet
        with:
          cache: true
          # No lock file to key on; CPM makes this the one file that pins every version.
          cache-dependency-path: Directory.Packages.props

      # Whole solution in every cached job: one OS-keyed immutable entry, so a job that
      # restored a subset would win the race and freeze the cache on it.
      - name: Restore solution
        if: matrix.shard != 'daemon' || steps.tests.outputs.solution != ''
        run: dotnet restore Capacitor.slnx

      - name: Build solution
        if: matrix.shard != 'daemon' || steps.tests.outputs.solution != ''
        run: dotnet build ${{ matrix.shard == 'daemon' && steps.tests.outputs.solution || 'Capacitor.slnx' }} --no-restore

      # Plain-Node assertion scripts, no framework or npm install. Bash gives -e on every leg.
      - name: Run npm wrapper tests
        if: matrix.shard != 'daemon'
        shell: bash
        run: |
          node npm/kcap/bin/kcap.test.js
          node npm/kcap/bin/resolve.test.js
          node npm/kcap/bin/refresh.test.js

      - name: Set up comment rules
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-comment-rules

      - name: Run shell script tests
        if: runner.os == 'Linux'
        run: bash scripts/run-shell-tests.sh

      # The runner has no user manager until lingering is on, and the local server's live service test
      # needs one to load its unit.
      - name: Start a systemd user session
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          [ -S "/run/user/$uid/bus" ] || { echo "no systemd user bus at /run/user/$uid/bus" >&2; exit 1; }
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"

      # The runner's default shell, not bash: on Windows, Git Bash puts its own usr/bin ahead of
      # System32 on PATH, and a test that runs `timeout` through cmd.exe then gets the GNU one.
      - name: Run tests
        if: steps.tests.outputs.solution != ''
        env:
          # The live launchd/systemd test loads a uniquely named unit; a disposable runner is the place for it.
          KCAP_LOCAL_SERVICE_CHECK: ${{ runner.os != 'Windows' && '1' || '' }}
        # Assemblies and per-assembly width are per-leg, above: the ceiling is what the runner can
        # carry without the wall-clock budgets inside the code under test expiring. Five modules
        # starved those and vanished an Integration test's temp working directory on Linux, a
        # cross-assembly sharing point no in-assembly [NotInParallel] key can serialise. A keyed
        # [NotInParallel] test still runs concurrently with every disjoint-key class, so anything
        # touching process-global state must hold the same key as every other toucher.
        # --hangdump writes a mini dump after 10m with no test-host activity.
        run: >
          dotnet test --solution ${{ steps.tests.outputs.solution }} --no-build
          --max-parallel-test-modules ${{ matrix.modules }}
          -- --maximum-parallel-tests ${{ matrix.tests }}
          --hangdump --hangdump-timeout 10m --hangdump-type Mini

      # Kept on success too: the console prints nothing between banner and summary, so these are the
      # only per-test timing record. File kinds and not the directory: upload-artifact roots the
      # archive at the common ancestor of its paths, and this also skips the TRX attachment folder,
      # a second copy of the HTML report.
      #
      # continue-on-error: a diagnostic must never decide whether the tests passed. An artifact-service
      # 403 is classed non-retryable, so without this it reddens a run that reported `failed: 0`.
      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.leg }}-attempt-${{ github.run_attempt }}
          path: |
            TestResults/*.html
            TestResults/*.trx
            TestResults/*.tunit-report.json
            TestResults/*.dmp
            TestResults/*hang*
          retention-days: 3
          if-no-files-found: ignore

  # A change of only plugin markdown cannot reach code, so one Linux leg runs the suites that read the
  # plugin as text, the skill-listing guard among them, in place of the build-and-test matrix.
  plugin-docs:
    name: Plugin markdown guards
    needs: changes
    if: needs.changes.outputs.plugin-docs == 'true'
    runs-on: ubuntu-latest
    # Measured at 7.5m; this only has to catch a wedge.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          cache: true
          cache-dependency-path: Directory.Packages.props

      # The whole solution, for the same shared cache entry build-and-test restores.
      - name: Restore solution
        run: dotnet restore Capacitor.slnx

      - name: Run the plugin's text guards
        env:
          PROJECTS: ${{ needs.changes.outputs.projects }}
        run: |
          set -euo pipefail
          solution=Capacitor.slnx
          if [ "$PROJECTS" != all ]; then
            solution=selected-tests.slnf
            list="$(printf '"%s",' $PROJECTS)"
            printf '{"solution":{"path":"Capacitor.slnx","projects":[%s]}}\n' "${list%,}" > "$solution"
            cat "$solution"
          fi
          dotnet build "$solution" --no-restore
          dotnet test --solution "$solution" --no-build \
            --max-parallel-test-modules 3 -- --maximum-parallel-tests 4

  lint-comments:
    name: Comment rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-comment-rules
      - name: No Linear issue IDs
        run: bash scripts/check-linear-ids.sh
      - name: No banned comment tokens
        run: bash scripts/check-comment-rules.sh

  # One version for the daemon, the CLI, the app and the package, so the app's CLI floor assertion
  # and Velopack's SemVer check see the same value.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    env:
      # minver-cli is a framework-dependent global tool built for an older runtime than the pinned SDK.
      DOTNET_ROLL_FORWARD: Major
    steps:
      # Full history and tags: MinVer derives the version from the nearest tag, and a shallow checkout
      # computes a default below the app's CLI floor.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install minver
        run: dotnet tool install -g minver-cli --version 8.0.0

      # The standalone tool does not read MinVerTagPrefix from Directory.Build.props.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          FULL="$(minver --tag-prefix v)"
          echo "VERSION=${FULL%%+*}" >> "$GITHUB_OUTPUT"
          echo "computed $FULL"

  cli:
    name: CLI
    needs: version
    uses: ./.github/workflows/cli-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      # macOS runners are the org's scarcest pool, so PRs skip the macOS CLI and app. Pushes keep
      # building both, because release waits on the tag's run.
      rids: ${{ github.event_name == 'push' && 'osx-arm64 win-x64 linux-x64' || 'win-x64 linux-x64' }}

  desktop:
    name: Desktop
    needs: [version, cli]
    strategy:
      fail-fast: false
      matrix:
        rid: ${{ github.event_name == 'push' && fromJSON('["osx-arm64","win-x64","linux-x64"]') || fromJSON('["win-x64","linux-x64"]') }}
    uses: ./.github/workflows/desktop.yml
    with:
      rid: ${{ matrix.rid }}
      version: ${{ needs.version.outputs.version }}

  # The one check the release waits on, so renaming or adding a job above never needs a matching
  # change there.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, build-and-test, plugin-docs, lint-comments, cli, desktop]
    runs-on: ubuntu-latest
    steps:
      # build-and-test and plugin-docs are alternatives, so exactly one job is skipped: whichever of
      # those two did not run.
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          TESTS: ${{ needs.build-and-test.result }} ${{ needs.plugin-docs.result }}
        run: |
          skipped=0
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              skipped) skipped=$((skipped + 1)) ;;
              *) echo "::error::a CI job ended $result"; exit 1 ;;
            esac
          done
          case "$TESTS" in
            'success skipped' | 'skipped success') ;;
            *) echo "::error::the test jobs ended $TESTS"; exit 1 ;;
          esac
          [ "$skipped" -eq 1 ] || { echo "::error::$skipped CI jobs were skipped"; exit 1; }
