name: Qodana
# A full scan takes over two hours, so main is scanned nightly or on demand. A PR is scanned in PR
# mode, which analyses only what it changes
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      clean-cache:
        description: Scan without the saved Qodana cache, so a scan of main replaces it with a fresh one
        type: boolean
        default: false
  pull_request:

jobs:
  qodana:
    # A fork PR's run gets no QODANA_TOKEN
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: qodana-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # The kcap-heavy Hetzner runners serve private repositories only
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      checks: write
      actions: write
    env:
      QODANA_CACHE_KEY: qodana-dotnet-mtimes-2026.2
    steps:
      # PR mode analyses the merge-base and the head, so it needs the history and the head, not
      # GitHub's merge commit
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Shares CI's NuGet cache entry; the restore itself runs as Qodana's bootstrap, once per analysed revision
      - uses: ./.github/actions/setup-dotnet
        with:
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Only main's scans save, so a PR restores the entry main's last scan left
      - name: Restore the Qodana cache
        if: ${{ !inputs.clean-cache }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/qodana/caches
          key: ${{ env.QODANA_CACHE_KEY }}

      # The cache judges a file changed by its timestamp, and a checkout stamps every file anew
      - name: Give unchanged files the timestamps the cache saw
        run: |
          python3 -I .github/scripts/qodana_mtimes.py restore "$RUNNER_TEMP/qodana/caches/mtimes.tsv"
          python3 -I .github/scripts/qodana_mtimes.py record "$RUNNER_TEMP/qodana/caches/mtimes.tsv"

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --linter qodana-dotnet --within-docker false
          cache-dir: ${{ runner.temp }}/qodana/caches
          use-caches: false
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_413606919 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'

      - name: Count the files the C# engine analysed
        if: always()
        run: |
          for log in "$RUNNER_TEMP"/qodana/results/log/[0-9]*.backend.log; do
            [ -f "$log" ] || continue
            echo "$log: $(grep -c 'Daemon process [0-9]* finished on file' "$log") files," \
              "$(grep -E 'Daemon process [0-9]* (started|finished) on file' "$log" | sed -n '1p;$p' | cut -c1-8 | paste -sd '-' -)"
          done

      # A cache entry is immutable, so main's scan deletes the last one before saving its own
      - name: Drop the previous Qodana cache
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for id in $(gh cache list --ref "$GITHUB_REF" --key "$QODANA_CACHE_KEY" --json id,key \
              --jq ".[] | select(.key == \"$QODANA_CACHE_KEY\") | .id"); do
            gh cache delete "$id"
          done
      - name: Save the Qodana cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/qodana/caches
          key: ${{ env.QODANA_CACHE_KEY }}
