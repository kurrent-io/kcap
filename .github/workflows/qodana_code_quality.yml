name: Qodana
# A full scan takes over two hours. While the cache trial runs, every scan is full, a PR's included,
# so re-running the job on a PR measures what the restored cache saves
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
  pull_request:

jobs:
  qodana:
    # A fork PR's run gets no QODANA_TOKEN
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: qodana-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # The kcap-heavy Hetzner runners serve private repositories only
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      checks: write
      actions: write
    env:
      QODANA_CACHE_KEY: qodana-mtime-trial-2026.2
    steps:
      # PR mode analyses the merge-base and the head, so it needs the history and the head, not
      # GitHub's merge commit
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Shares CI's NuGet cache entry; the restore itself runs as Qodana's bootstrap, once per analysed revision
      - uses: ./.github/actions/setup-dotnet
        with:
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore the Qodana cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/qodana/caches
          key: ${{ env.QODANA_CACHE_KEY }}

      # The analysis judges a file changed by its timestamp, and a checkout stamps every file anew
      - name: Give unchanged files the timestamps the cache saw
        run: |
          python3 -I .github/scripts/qodana_mtimes.py restore "$RUNNER_TEMP/qodana/caches/mtimes.tsv"
          python3 -I .github/scripts/qodana_mtimes.py record "$RUNNER_TEMP/qodana/caches/mtimes.tsv"

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --linter qodana-dotnet --within-docker false
          cache-dir: ${{ runner.temp }}/qodana/caches
          use-caches: false
          pr-mode: false
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_413606919 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'

      - name: Count the files the C# engine analysed
        if: always()
        run: |
          for log in "$RUNNER_TEMP"/qodana/results/log/[0-9]*.backend.log; do
            [ -f "$log" ] || continue
            echo "$log: $(grep -c 'Starting invisible analysis of file' "$log") files analysed"
            grep -F '"SWEA.Load"' "$log" || true
          done

      # A cache entry is immutable, so each run deletes its ref's entry before saving its own
      - name: Drop the previous Qodana cache
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for id in $(gh cache list --ref "$GITHUB_REF" --key "$QODANA_CACHE_KEY" --json id,key \
              --jq ".[] | select(.key == \"$QODANA_CACHE_KEY\") | .id"); do
            gh cache delete "$id"
          done
      - name: Save the Qodana cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/qodana/caches
          key: ${{ env.QODANA_CACHE_KEY }}
