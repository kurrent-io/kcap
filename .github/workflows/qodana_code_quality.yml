name: Qodana
# A full scan takes over two hours, so main is scanned nightly or on demand. A PR is scanned in PR
# mode, which analyses only what it changes
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
  pull_request:

jobs:
  qodana:
    # A fork PR's run gets no QODANA_TOKEN
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: qodana-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # The kcap-heavy Hetzner runners serve private repositories only
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      # PR mode analyses the merge-base and the head, so it needs the history and the head, not
      # GitHub's merge commit
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Shares CI's NuGet cache entry; the restore itself runs as Qodana's bootstrap, once per analysed revision
      - uses: ./.github/actions/setup-dotnet
        with:
          cache: true
          cache-dependency-path: Directory.Packages.props

      # No Qodana cache: the C# engine re-analyses every file each run, and a restored cache saved no time
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --linter qodana-dotnet --within-docker false
          use-caches: false
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_413606919 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
