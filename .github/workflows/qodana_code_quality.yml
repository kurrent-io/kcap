name: Qodana
# A full scan takes over two hours, so main is scanned nightly or on demand and a PR only once it
# carries the qodana label; every other PR shows the job as skipped
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, labeled, synchronize]

jobs:
  qodana:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'qodana') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'qodana'))
    # Job-level, so a skipped run (another label added) never cancels a scan in progress
    concurrency:
      group: qodana-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # The kcap-heavy Hetzner runners serve private repositories only
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      # PR mode analyses the merge-base and the head, so it needs the history and the head, not
      # GitHub's merge commit
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.2
        with:
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_413606919 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
