# Routine sweeps only — security updates are a separate always-on channel in repo settings. Weekly, not
# daily: Dependabot rebases an open group PR every run, and each rebase re-runs the whole matrix.
# No `docker`/`npm` — nothing there is a dependency manifest; see the comments at those pins.
# 3-day cooldown so a poisoned release has time to be yanked; security updates ignore it by design.
version: 2
updates:
  # CPM: Directory.Packages.props is the single pin, and setup-dotnet keys its restore cache on it.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
    # A package joins the first group it matches. The first two take every update type, since a major
    # split across PRs cannot build.
    groups:
      # Every PR here needs Native/AvaloniaNative/build.sh rerun on a Mac: the patched
      # libAvaloniaNative.dylib is stamped with the Avalonia version. Libraries built on Avalonia are
      # members because they drag Avalonia into whichever group they land in.
      avalonia:
        patterns: ["Avalonia*", "*.Avalonia", "*.Avalonia.*", "ReactiveUI*", "DynamicData"]
      # TUnit and the Microsoft.Testing extensions share one platform version line.
      testing:
        patterns:
          - "TUnit*"
          - "Microsoft.Testing.*"
          - "WireMock.Net*"
          - "NSubstitute*"
          - "Testcontainers*"
          - "Microsoft.Extensions.TimeProvider.Testing"
      # Majors stay ungrouped from here on: one is a judgement call, and must not ride along in a batch.
      dotnet-servicing:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
          - "Microsoft.Data.Sqlite"
          - "SQLitePCLRaw.*"
          - "System.*"
        update-types: [minor, patch]
      nuget-other:
        patterns: ["*"]
        update-types: [minor, patch]

  # Monthly: rollForward latestFeature means every 10.0.1xx SDK already satisfies the pin, so raising
  # it only raises every developer machine's floor.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore

  # All on major tags, so these arrive as majors — each a runner-version question (v5+ of the
  # GitHub-owned actions needs runner >= 2.327.1), not a rubber stamp.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
