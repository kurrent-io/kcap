name: Set up comment rules
description: Install the pinned syntax parsers used by the comment gate and its shell tests
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: scripts/comment-rules-requirements.txt
    - shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/comment-rules"
        "$RUNNER_TEMP/comment-rules/bin/python3" -m pip install --only-binary=:all: -r scripts/comment-rules-requirements.txt
        echo "$RUNNER_TEMP/comment-rules/bin" >> "$GITHUB_PATH"
